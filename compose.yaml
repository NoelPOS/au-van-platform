services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Payment-proof object storage for local development, speaking the same S3
  # API the deployed target's bucket does (ADR-009), so the application talks
  # to one client either way.
  #
  # Versity S3 Gateway, serving the S3 API over a plain directory (its posix
  # backend). Chosen because it pulls anonymously from Docker Hub, which
  # neither a fresh checkout nor CI is logged in to; it is Apache-2.0 and
  # about 31 MB; it checks every SigV4 signature against the root credentials
  # below, so a wrong key fails here the way it would against AWS; it serves
  # buckets path-style, which is what PaymentProofStorageConfiguration asks
  # for; and a bucket is just a top-level directory, so `mkdir` creates the
  # payment-proof bucket on every start and no one-shot init job is needed.
  #
  # MinIO was dropped (#88): quay.io/minio/minio now answers 401 to an
  # anonymous pull, docker.io/minio/minio was already refused, and the
  # upstream repository was archived after its last push on 2026-04-24.
  object-store:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ['sh', '-c']
    command:
      - >-
        mkdir -p /data/${PAYMENT_PROOF_BUCKET:-au-van-payment-proofs} &&
        exec versitygw --port :9000 --health /health posix /data
    environment:
      # The same pair the API reads from .env through the AWS SDK's default
      # credentials chain. The gateway refuses to start with either one blank.
      ROOT_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      ROOT_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Must be the region the API signs with: SigV4 puts it in the signature,
      # so a mismatch rejects every request.
      VGW_REGION: ${PAYMENT_PROOF_REGION:-ap-southeast-1}
    ports:
      - '9000:9000'
    volumes:
      # A named volume rather than a bind mount: the posix backend keeps object
      # metadata in extended attributes and refuses to start on a directory
      # that cannot hold them.
      - object-store-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/health']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: api
    env_file: .env
    environment:
      # The service names, not localhost: inside the compose network the
      # defaults in application.yml point the API at its own container.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATA_REDIS_HOST: redis
      PAYMENT_PROOF_ENDPOINT: http://object-store:9000
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
      # Started alongside, not waited on. No application code uses Redis yet
      # (ADR-003, ADR-007) and its health indicator is disabled, so making the
      # API's startup depend on it would claim a coupling that does not exist.
      redis:
        condition: service_started

  web:
    build:
      context: web
    # 8081, because the API already publishes 8080 and `npm run dev` already
    # takes 5173. This is the production build served the way it is deployed:
    # the SPA and /api on one origin.
    ports:
      - '8081:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  object-store-data:
