services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Payment-proof object storage for local development, speaking the same S3
  # API the deployed target's bucket does (ADR-009), so the application talks
  # to one client either way.
  #
  # Pulled from quay.io rather than Docker Hub: an anonymous pull of
  # docker.io/minio/minio is refused, and neither a fresh checkout nor CI is
  # logged in to anything.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    # No MINIO_ROOT_USER/MINIO_ROOT_PASSWORD, so the image's own
    # minioadmin/minioadmin applies: a local development default is not a
    # credential worth committing a value for. Put the same pair in .env as
    # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY for the API to use.
    ports:
      # 9000 is the S3 API, 9001 the console the bucket is created from.
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc` ships in the image and `local` is its own preconfigured alias.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: api
    env_file: .env
    environment:
      # The service names, not localhost: inside the compose network the
      # defaults in application.yml point the API at its own container.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATA_REDIS_HOST: redis
      PAYMENT_PROOF_ENDPOINT: http://minio:9000
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Started alongside, not waited on. No application code uses Redis yet
      # (ADR-003, ADR-007) and its health indicator is disabled, so making the
      # API's startup depend on it would claim a coupling that does not exist.
      redis:
        condition: service_started

  web:
    build:
      context: web
    # 8081, because the API already publishes 8080 and `npm run dev` already
    # takes 5173. This is the production build served the way it is deployed:
    # the SPA and /api on one origin.
    ports:
      - '8081:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
