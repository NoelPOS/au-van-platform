plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

import org.springframework.boot.gradle.tasks.run.BootRun

group = 'com.auvan'
version = '0.0.1-SNAPSHOT'
description = 'AU-Van API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Boot 4 moved Flyway auto-configuration here; without it flyway-core sits unused.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.security:spring-security-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation platform('software.amazon.awssdk:bom:2.46.7')
	implementation 'software.amazon.awssdk:s3'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep the postgres tag excluded: ./gradlew test must need no Docker, and CI would not
// notice if it did.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'postgres'
	}
}

tasks.register('postgresTest', Test) {
	group = 'verification'
	description = 'Runs the @Tag("postgres") concurrency suite against a real PostgreSQL container. Requires Docker.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'postgres'
	}
}

tasks.register('bootstrapAdmin', BootRun) {
	group = 'application'
	description = 'Creates or promotes the configured LINE subject as the initial AU-Van administrator.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.auvan.api.auth.bootstrap.AdminBootstrapApplication'
}
