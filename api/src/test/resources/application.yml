# This file replaces the main application.yml outright in tests; it is not
# merged with it. New configuration has to be added to both files.
spring:
  datasource:
    url: jdbc:h2:mem:au_van;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 0
  mvc:
    problemdetails:
      enabled: true

auth:
  jwt:
    issuer: au-van-api-test
    audience: au-van-web-test
    access-token-ttl: PT15M
  line:
    channel-id: test-channel-id
  admin-bootstrap:
    line-subject:

booking:
  hold-ttl: PT5M
  max-seats-per-hold: 4
