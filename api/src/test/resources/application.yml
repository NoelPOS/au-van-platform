# This file replaces the main application.yml outright in tests; it is not
# merged with it. New configuration has to be added to both files.
# The *.enabled: false flags keep the schedulers and the real LINE sender out of test contexts.
spring:
  datasource:
    url: jdbc:h2:mem:au_van;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 0
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

cors:
  allowed-origins: http://localhost:5173

auth:
  jwt:
    issuer: au-van-api-test
    audience: au-van-web-test
    access-token-ttl: PT15M
  line:
    channel-id: test-channel-id
    api-base-url: https://api.line.me
  admin-bootstrap:
    line-subject:

booking:
  hold-ttl: PT5M
  max-seats-per-hold: 4
  payment-window: PT2H
  departure-cutoff: PT1H
  idempotency-key-retention: PT24H
  expiry:
    enabled: false
    poll-interval: PT1M
    batch-size: 50
  waitlist:
    enabled: false
    promotion-window: PT30M
    poll-interval: PT1M
    batch-size: 50

outbox:
  batch-size: 50
  max-attempts: 5
  backoff-base: PT30S
  backoff-cap: PT1H
  lease: PT2M
  dispatch:
    enabled: false
    poll-interval: PT5S

notification:
  line:
    enabled: false
    api-base-url: https://api.line.me
    channel-access-token:

payment-proof:
  bucket: test-payment-proofs
  region: ap-southeast-1
  endpoint:
  max-file-size: 5MB

management:
  health:
    redis:
      enabled: false
