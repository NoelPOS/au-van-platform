spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/au_van}
    username: ${SPRING_DATASOURCE_USERNAME:au_van}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

auth:
  jwt:
    issuer: au-van-api
    audience: au-van-web
    secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
  line:
    channel-id: ${LINE_CHANNEL_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET,POST
