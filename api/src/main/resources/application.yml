spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/au_van}
    username: ${SPRING_DATASOURCE_USERNAME:au_van}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Kept above payment-proof.max-file-size so the application answers oversize uploads.
      max-file-size: 8MB
      max-request-size: 8MB
  lifecycle:
    # Under ECS's default 30s stopTimeout, so a task drains before it is killed.
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

cors:
  # Shared with management.endpoints.web.cors; never a wildcard: requests carry Authorization.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  jwt:
    issuer: au-van-api
    audience: au-van-web
    secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
  line:
    channel-id: ${LINE_CHANNEL_ID:}
    # SECURITY CONTROL: moved off LINE, this instance trusts whatever that host says about a
    # token (ADR-013). Only the end-to-end compose overlay points it elsewhere.
    api-base-url: ${LINE_LOGIN_API_BASE_URL:https://api.line.me}
  admin-bootstrap:
    line-subject: ${ADMIN_BOOTSTRAP_LINE_SUBJECT:}

booking:
  hold-ttl: PT5M
  max-seats-per-hold: 4
  payment-window: PT2H
  departure-cutoff: PT1H
  closes-before-departure: PT90M
  cancellation-closes-before-departure: PT2H
  resubmit-window: PT30M
  # Must exceed any client's retry horizon: a pruned key lets a retry write a second booking.
  idempotency-key-retention: PT24H
  expiry:
    enabled: true
    poll-interval: PT1M
    batch-size: 50
  waitlist:
    enabled: true
    promotion-window: PT30M
    poll-interval: PT1M
    batch-size: 50
  cooldown:
    expiries: 2
    lookback: P7D
    duration: PT24H

outbox:
  batch-size: 50
  # With the backoff below, the retry schedule must finish well inside LINE's 24-hour
  # retry-key window, or a late retry can send the student a second message (ADR-010).
  max-attempts: 5
  backoff-base: PT30S
  backoff-cap: PT1H
  # Must stay longer than one send, or a second worker claims a row still being sent.
  lease: PT2M
  dispatch:
    enabled: true
    poll-interval: PT5S

live-updates:
  # PostgreSQL LISTEN/NOTIFY carries each signal to every API instance (ADR-018).
  postgres-notify: true
  ticket-ttl: PT1M
  # Under the web image's 30s proxy_read_timeout, so an idle stream is never cut.
  heartbeat-interval: PT25S

notification:
  line:
    enabled: ${LINE_MESSAGING_ENABLED:true}
    api-base-url: ${LINE_MESSAGING_API_BASE_URL:https://api.line.me}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
    liff-url: ${LINE_LIFF_URL:}

payment-proof:
  bucket: ${PAYMENT_PROOF_BUCKET:au-van-payment-proofs}
  region: ${PAYMENT_PROOF_REGION:ap-southeast-1}
  endpoint: ${PAYMENT_PROOF_ENDPOINT:}
  max-file-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET,POST
  health:
    redis:
      # Off because no code uses Redis yet and its indicator would report DOWN wherever Redis
      # is absent. Re-enable this with the first Redis-backed feature.
      enabled: false
