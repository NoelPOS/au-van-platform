name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  commits:
    name: Commit checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          status=0
          for sha in $(git rev-list "origin/$BASE_REF..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            subject=$(head -n 1 /tmp/commit-msg)
            # The hook exempts these so local work is not obstructed, but a
            # rebase merge would land them on the default branch as-is.
            case "$subject" in
              'fixup! '*|'squash! '*)
                echo "commit-msg: tidy away '$subject' before merging." >&2
                status=1
                continue
                ;;
            esac
            if ! .githooks/commit-msg /tmp/commit-msg; then
              echo "  in commit $(git log -1 --format='%h %s' "$sha")"
              status=1
            fi
          done
          exit $status

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew test

  # Deliberately holds no AWS credential, configures no OIDC role, and asks
  # for no `permissions:`. fmt, init -backend=false and validate need none of
  # that, and the job must not be able to reach AWS even by mistake. It proves
  # that the Terraform is well-formed and that its references resolve; it does
  # not prove that the infrastructure works.
  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned so a run today and a run in six months check the same
          # thing. Must stay at or above the `required_version` the modules
          # declare in their `versions.tf`.
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate every module
        run: |
          # Discovered rather than listed, so a module added under infra/ is
          # validated the moment it lands, the same way `fmt -check
          # -recursive` already picks it up.
          modules=$(find infra -name '*.tf' -exec dirname {} \; | sort -u)
          if [ -z "$modules" ]; then
            echo "No Terraform module found under infra/." >&2
            exit 1
          fi
          status=0
          while IFS= read -r dir; do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false || status=1
            terraform -chdir="$dir" validate || status=1
          done <<< "$modules"
          exit $status

  # Like `Infrastructure checks` above, this job deliberately holds no
  # credential: no registry login, no `docker push`, no `permissions:` block
  # and no `secrets.` reference. It builds the images and runs them, which is
  # the whole of the verification; nothing is deployed anywhere.
  #
  # Measured, rather than estimated: 2m19s. A GitHub-hosted runner keeps no
  # layer cache between runs, so every run is that cold run -- 1m36s building
  # both images, 32s waiting for four containers to report healthy, and
  # seconds for everything else. The job runs in parallel with the others and
  # is now the longest of them, so it takes a pull request's wall-clock time
  # from about 1m40s, which was `API checks`, to about 2m20s.
  #
  # Plain `docker compose build`, deliberately. build-push-action with
  # `type=gha` caching would cut the image build, but it roughly doubles this
  # file and brings its own failure modes, and 40 seconds is not worth that.
  containers:
    name: Container checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint the API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint the web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

      - name: Write a throwaway environment file
        run: |
          # Generated for this runner and thrown away with it. The API refuses
          # to start with a blank JWT_SECRET and Flyway needs a reachable
          # database, so "the image runs" can only be checked with both set.
          {
            echo "POSTGRES_DB=au_van"
            echo "POSTGRES_USER=au_van"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "LINE_CHANNEL_ID="
            echo "ADMIN_BOOTSTRAP_LINE_SUBJECT="
          } > .env

      - name: Build both images
        run: docker compose build

      - name: Check that neither container runs as root
        run: |
          # Numeric, because ECS's and Kubernetes' runAsNonRoot checks read the
          # uid from the image configuration rather than resolving a name.
          for service in api web; do
            uid=$(docker compose run --rm --no-deps --entrypoint id "$service" -u)
            echo "$service runs as uid $uid"
            [ "$uid" -ne 0 ]
          done

      - name: Start the whole stack
        run: docker compose up -d --wait

      - name: Check the API health endpoint
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Check the SPA and the API it proxies
        run: |
          # Both on one origin, which is the contract the bundle relies on:
          # the SPA calls a relative /api and the serving layer routes it.
          curl -fsS http://localhost:8081/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'

      - name: Check that no API host was inlined into the bundle
        run: |
          # web/.env.example ships VITE_API_BASE_URL=http://localhost:8080, and
          # `vite build` auto-loads .env before any build argument is read. If
          # such a file ever reaches the build stage, Vite inlines that host
          # into the bundle and every deployed request goes to the visitor's
          # own machine, with no error raised anywhere. web/.dockerignore keeps
          # it out and the build stage asserts it; this is the last check, on
          # the artefact that is actually served.
          docker compose cp web:/usr/share/nginx/html ./served
          if grep -rn 'localhost:8080' ./served; then
            echo "The served bundle carries a build-time API host." >&2
            exit 1
          fi

      - name: Check that the API shuts down on SIGTERM
        run: |
          # The JVM has to be PID 1 and has to exit on the signal. Anything
          # in front of it that does not forward SIGTERM makes every stop wait
          # out the full grace period and end in SIGKILL, dropping in-flight
          # requests -- which nothing else here would notice.
          pid1=$(docker compose exec -T api cat /proc/1/comm)
          echo "api pid 1 is $pid1"
          [ "$pid1" = "java" ]
          start=$(date +%s)
          docker compose stop -t 30 api
          elapsed=$(( $(date +%s) - start ))
          echo "api stopped in ${elapsed}s"
          [ "$elapsed" -lt 15 ]

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
