name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    env:
      # The one authoritative Node pin. web/Dockerfile's build stage has to
      # carry the same version, and the step below fails this job when it does
      # not, so the image cannot end up building the application on a
      # different runtime from the one this required check exercises.
      NODE_VERSION: 22.23.2
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - name: Check that the web image pins the same Node
        working-directory: .
        run: |
          # An assertion rather than a pair of comments, because this is a
          # required check: a pull request that moves one pin without the
          # other cannot reach main.
          pinned=$(sed -n 's/^FROM node:\([^-]*\)-.*/\1/p' web/Dockerfile)
          echo "Web checks pins $NODE_VERSION; web/Dockerfile pins ${pinned:-nothing}"
          if [ "$pinned" != "$NODE_VERSION" ]; then
            echo "The two Node pins have drifted. Move both together, in one" >&2
            echo "pull request: NODE_VERSION above and the build stage's FROM" >&2
            echo "line in web/Dockerfile, tag and digest." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  commits:
    name: Commit checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          status=0
          for sha in $(git rev-list "origin/$BASE_REF..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            subject=$(head -n 1 /tmp/commit-msg)
            # The hook exempts these so local work is not obstructed, but a
            # rebase merge would land them on the default branch as-is.
            case "$subject" in
              'fixup! '*|'squash! '*)
                echo "commit-msg: tidy away '$subject' before merging." >&2
                status=1
                continue
                ;;
            esac
            if ! .githooks/commit-msg /tmp/commit-msg; then
              echo "  in commit $(git log -1 --format='%h %s' "$sha")"
              status=1
            fi
          done
          exit $status

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check that LINE token verification still defaults to LINE
        working-directory: .
        run: |
          # auth.line.api-base-url was made configurable so the Playwright
          # suite can point an instance at a verification double (ADR-013).
          # The default is the whole of what keeps that safe: an instance that
          # resolves it anywhere else believes whatever that host asserts about
          # a token. An assertion rather than a comment, and in this job rather
          # than one of the optional ones, because this is a required check.
          expected='api-base-url: ${LINE_LOGIN_API_BASE_URL:https://api.line.me}'
          if ! grep -qF "$expected" api/src/main/resources/application.yml; then
            echo "auth.line.api-base-url no longer defaults to LINE's own host." >&2
            echo "Expected this line in api/src/main/resources/application.yml:" >&2
            echo "  $expected" >&2
            exit 1
          fi
      - run: ./gradlew test

  # The other half of the API suite: the @Tag("postgres") classes, which run
  # against a real PostgreSQL 17 rather than H2 in PostgreSQL-compatibility
  # mode. `API checks` above deliberately does not run them, because
  # `./gradlew test` is the local gate README.md and .claude/agents/
  # implementer.md both promise needs no Docker.
  #
  # Testcontainers starts the server itself, so no `services:` block: the tests
  # own the container's lifetime and its image tag, which is pinned to the same
  # postgres:17-alpine that compose.yaml runs.
  #
  # Not a required status check on day one, deliberately. `Commit checks` was
  # promoted to required only once it had been green on real pull requests, and
  # infra/README.md records the same intent for `Infrastructure checks`. Promote
  # this one the same way, after two or three green runs.
  postgres:
    name: Database concurrency checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew postgresTest

  # Deliberately holds no AWS credential, configures no OIDC role, and asks
  # for no `permissions:`. fmt, init -backend=false and validate need none of
  # that, and the job must not be able to reach AWS even by mistake. It proves
  # that the Terraform is well-formed and that its references resolve; it does
  # not prove that the infrastructure works.
  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned so a run today and a run in six months check the same
          # thing. Must stay at or above the `required_version` the modules
          # declare in their `versions.tf`.
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate every module
        run: |
          # Discovered rather than listed, so a module added under infra/ is
          # validated the moment it lands, the same way `fmt -check
          # -recursive` already picks it up.
          modules=$(find infra -name '*.tf' -exec dirname {} \; | sort -u)
          if [ -z "$modules" ]; then
            echo "No Terraform module found under infra/." >&2
            exit 1
          fi
          status=0
          while IFS= read -r dir; do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false || status=1
            terraform -chdir="$dir" validate || status=1
          done <<< "$modules"
          exit $status

  # Like `Infrastructure checks` above, this job deliberately holds no
  # credential: no registry login, no `docker push`, no `permissions:` block
  # and no `secrets.` reference. It builds the images and runs them, which is
  # the whole of the verification; nothing is deployed anywhere.
  #
  # Measured, rather than estimated: 2m19s. A GitHub-hosted runner keeps no
  # layer cache between runs, so every run is that cold run -- 1m36s building
  # both images, 32s waiting for four containers to report healthy, and
  # seconds for everything else. The job runs in parallel with the others and
  # is now the longest of them, so it takes a pull request's wall-clock time
  # from about 1m40s, which was `API checks`, to about 2m20s.
  #
  # Plain `docker compose build`, deliberately. build-push-action with
  # `type=gha` caching would cut the image build, but it roughly doubles this
  # file and brings its own failure modes, and 40 seconds is not worth that.
  containers:
    name: Container checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint the API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint the web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

      - name: Write a throwaway environment file
        run: |
          # Generated for this runner and thrown away with it. The API refuses
          # to start with a blank JWT_SECRET and Flyway needs a reachable
          # database, so "the image runs" can only be checked with both set.
          {
            echo "POSTGRES_DB=au_van"
            echo "POSTGRES_USER=au_van"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "LINE_CHANNEL_ID="
            echo "ADMIN_BOOTSTRAP_LINE_SUBJECT="
          } > .env

      - name: Build both images
        run: docker compose build

      - name: Check that neither container runs as root
        run: |
          # Numeric, because ECS's and Kubernetes' runAsNonRoot checks read the
          # uid from the image configuration rather than resolving a name.
          for service in api web; do
            uid=$(docker compose run --rm --no-deps --entrypoint id "$service" -u)
            echo "$service runs as uid $uid"
            [ "$uid" -ne 0 ]
          done

      - name: Start the whole stack
        run: docker compose up -d --wait

      - name: Check the API health endpoint
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Check the SPA and the API it proxies
        run: |
          # Both on one origin, which is the contract the bundle relies on:
          # the SPA calls a relative /api and the serving layer routes it.
          curl -fsS http://localhost:8081/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'

      - name: Check that no API host was inlined into the bundle
        run: |
          # web/.env.example ships VITE_API_BASE_URL=http://localhost:8080, and
          # `vite build` auto-loads .env before any build argument is read. If
          # such a file ever reaches the build stage, Vite inlines that host
          # into the bundle and every deployed request goes to the visitor's
          # own machine, with no error raised anywhere. web/.dockerignore keeps
          # it out and the build stage asserts it; this is the last check, on
          # the artefact that is actually served.
          docker compose cp web:/usr/share/nginx/html ./served
          if grep -rn 'localhost:8080' ./served; then
            echo "The served bundle carries a build-time API host." >&2
            exit 1
          fi

      - name: Check that no end-to-end sign-in was built into the bundle
        run: |
          # ADR-013's other half, and the assertion that makes the sign-in seam
          # a seam rather than a bypass. VITE_E2E_AUTH gates a control that
          # posts a chosen subject straight to the exchange endpoint;
          # compose.e2e.yaml sets it and this job deliberately does not, so the
          # flag folds to false, the control's module is tree-shaken, and its
          # marker is absent from the artefact that is actually served.
          #
          # ./served is the copy the previous step took out of the running web
          # container, so this greps the same bytes a visitor is sent.
          if grep -rn 'auvan-e2e-sign-in' ./served; then
            echo "The served bundle carries the end-to-end sign-in control." >&2
            echo "web/src/auth/liff-config.ts explains why e2eAuthEnabled has" >&2
            echo "to stay a module-level constant for this to hold." >&2
            exit 1
          fi

      - name: Check that the API shuts down on SIGTERM
        run: |
          # The JVM has to be PID 1 and has to exit on the signal. Anything
          # in front of it that does not forward SIGTERM makes every stop wait
          # out the full grace period and end in SIGKILL, dropping in-flight
          # requests -- which nothing else here would notice.
          pid1=$(docker compose exec -T api cat /proc/1/comm)
          echo "api pid 1 is $pid1"
          [ "$pid1" = "java" ]
          start=$(date +%s)
          docker compose stop -t 30 api
          elapsed=$(( $(date +%s) - start ))
          echo "api stopped in ${elapsed}s"
          [ "$elapsed" -lt 15 ]

      - name: Tear the stack down
        if: always()
        run: docker compose down -v

  # The Playwright suite, against the whole stack: the real API, a real
  # PostgreSQL, real MinIO, and the production web bundle served by nginx --
  # plus the two things a Playwright run needs and a deployment must not have,
  # both of them in compose.e2e.yaml and neither of them in compose.yaml.
  #
  # It holds no LINE credential, needs no LIFF channel and makes no request
  # that leaves the runner: a stub answers LINE's verification endpoint and
  # `auth.line.api-base-url` points the API at it, which is the seam ADR-013
  # settles. `Container checks` above proves the other half -- that the sign-in
  # control the suite drives is absent from a production build.
  #
  # Not a required status check on day one, deliberately, on the same footing
  # as `Infrastructure checks`, `Container checks` and `Database concurrency
  # checks`: promote it after two or three green runs on real pull requests.
  e2e:
    name: End-to-end checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # The same pin `Web checks` holds; the suite is TypeScript run by
          # Playwright's own loader, so nothing here has to match the image.
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Write a throwaway environment file
        run: |
          # Generated for this runner and thrown away with it, exactly as
          # `Container checks` does it. LINE_CHANNEL_ID is deliberately absent:
          # compose.e2e.yaml sets it on the api service, and a service-level
          # environment value wins over env_file.
          {
            echo "POSTGRES_DB=au_van"
            echo "POSTGRES_USER=au_van"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "LINE_CHANNEL_ACCESS_TOKEN="
            echo "ADMIN_BOOTSTRAP_LINE_SUBJECT="
          } > .env

      - name: Install the suite and its browser
        working-directory: tests/e2e
        run: |
          npm ci
          npm run browsers

      - name: Start the end-to-end stack
        run: |
          # --build is not optional: the E2E web service differs from
          # compose.yaml's only in a build argument, so the two share an image
          # tag. A runner has no image to reuse, but the flag is what makes the
          # command here and the one in README.md the same command.
          docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait --build

      - name: Run the suite
        working-directory: tests/e2e
        run: npm test

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Show what the stack was doing when the suite failed
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --tail 200

      - name: Tear the stack down
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
